name: RPG CI Pipeline
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Core Test Suite
        run: npm test

      - name: Run Specialized Automated Load Test
        run: |
          node app.js &
          SERVER_PID=$!
          sleep 2
          node tests/stress.test.js
          kill $SERVER_PID